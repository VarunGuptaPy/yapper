# Design previews render screens to PNG for review, and the backup fixture
# writes a real .yapbackup to /tmp for on-device restore testing. Both depend
# on the machine they run on, so they are out of the normal suite.
#
# Run them explicitly with --run-skipped:
#   flutter test test/ui/preview_test.dart --update-goldens --run-skipped
#   flutter test test/backup/make_fixture_test.dart --run-skipped
tags:
  preview:
    skip: "run explicitly with --run-skipped"
  fixture:
    skip: "run explicitly with --run-skipped"
